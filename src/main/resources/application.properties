# Common settings shared across all profiles.
spring.application.name=todo-app

# Active profile is chosen at run time:
#   local dev (VS Code, MySQL)      -> --spring.profiles.active=dev   (also the default below)
#   production (Render, Postgres)   -> Render sets SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Thymeleaf: disable caching in dev so template edits show up without a restart.
# (overridden back to true in application-prod.properties)
spring.thymeleaf.cache=false

# Friendly error handling: never leak stack traces to the browser.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false

# File logging so issues can be diagnosed after the fact, not just in the console.
logging.file.name=logs/todo-app.log
logging.level.root=INFO
logging.level.edu.plapoly.todo=INFO
