# Production profile: Postgres, hosted on Render.
# Render injects a DATABASE_URL env var in the form:
#   postgres://USER:PASSWORD@HOST:PORT/DBNAME
# Set the three variables below in Render's dashboard (Environment tab) instead of
# hardcoding them here, so credentials never sit in source control.
# spring.datasource.url=${DATABASE_URL}
# spring.datasource.username=${DATABASE_USERNAME}
# spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# 'validate' in production: the schema should already exist (created once via 'update'
# on first deploy, or via the Postgres script in the README) rather than being mutated
# automatically on every restart.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true


logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.tool.schema=DEBUG


spring.thymeleaf.cache=true

server.port=${PORT:8080}
