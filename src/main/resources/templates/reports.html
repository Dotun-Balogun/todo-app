<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/fragments :: pageHead('Reports')}"></head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/fragments :: sidebar('reports')}"></div>

    <main class="main" style="max-width: 680px;">
        <div class="topbar">
            <div class="topbar-title">
                <h1>Productivity report</h1>
                <p>How your completed tasks break down by category.</p>
            </div>
        </div>

        <div class="stats-row" style="grid-template-columns: repeat(2, 1fr);">
            <div class="stat-card accent-green">
                <div class="stat-value" th:text="${totalCompleted}">0</div>
                <div class="stat-label">Tasks completed</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" th:text="${totalTasks}">0</div>
                <div class="stat-label">Tasks created in total</div>
            </div>
        </div>

        <div class="card card-pad">
            <div th:if="${#lists.isEmpty(breakdown)}" class="empty-state" style="padding: 30px 10px;">
                <p class="muted">No tasks yet — once you start adding tasks, your completion breakdown will show up here.</p>
            </div>

            <div th:each="b : ${breakdown}" class="report-row">
                <div class="report-row-head">
                    <span style="font-weight:600;">
                        <span class="category-dot" th:style="'background:' + ${b.colorCode}"></span>
                        <span th:text="${b.categoryName}" style="margin-left:6px;">Category</span>
                    </span>
                    <span class="count" th:text="${b.completed} + ' of ' + ${b.total} + ' done'">0 of 0</span>
                </div>
                <div class="report-bar-track">
                    <div class="report-bar-fill" th:style="'width:' + ${b.completionPercent()} + '%; background:' + ${b.colorCode}"></div>
                </div>
            </div>
        </div>
    </main>
</div>
<div th:replace="~{fragments/fragments :: scripts}"></div>
</body>
</html>
