<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<th:block th:fragment="pageHead(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title} + ' · Plapoly To-Do'">To-Do List</title>
    <link rel="icon" type="image/png" th:href="@{/images/crest.png}"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</th:block>
</head>
<body>

<!-- Sidebar navigation, reused across every authenticated page. 'active' param controls the highlighted link. -->
<th:block th:fragment="sidebar(active)">
<aside class="sidebar">
    <div class="sidebar-brand">
        <img class="sidebar-brand-mark" th:src="@{/images/crest.png}" alt="Plateau State Polytechnic crest"/>
        <div class="sidebar-brand-text">
            To-Do
            <small>Plateau State Polytechnic</small>
        </div>
    </div>
    <nav class="sidebar-nav">
        <a th:href="@{/dashboard}" class="sidebar-link" th:classappend="${active == 'dashboard'} ? 'active'">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
            <span class="label">Dashboard</span>
        </a>
        <a th:href="@{/categories}" class="sidebar-link" th:classappend="${active == 'categories'} ? 'active'">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41L11 3.83A2 2 0 0 0 9.59 3.24L4 3.24a1 1 0 0 0-1 1l0 5.59a2 2 0 0 0 .59 1.41l9.58 9.58a2 2 0 0 0 2.83 0l4.59-4.59a2 2 0 0 0 0-2.82z"/><circle cx="8" cy="8" r="1.5"/></svg>
            <span class="label">Categories</span>
        </a>
        <a th:href="@{/reports}" class="sidebar-link" th:classappend="${active == 'reports'} ? 'active'">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6"/><rect x="12" y="8" width="3" height="10"/><rect x="17" y="5" width="3" height="13"/></svg>
            <span class="label">Reports</span>
        </a>
        <a th:href="@{/profile}" class="sidebar-link" th:classappend="${active == 'profile'} ? 'active'">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
            <span class="label">Profile</span>
        </a>
    </nav>
    <div class="sidebar-footer">
        <div class="sidebar-user">
            <div class="sidebar-user-avatar" th:text="${#strings.substring(#authentication.name,0,1).toUpperCase()}">A</div>
            <span th:text="${#authentication.name}">username</span>
        </div>
        <button id="theme-toggle" class="sidebar-link" style="width:100%; border:none; background:transparent; cursor:pointer; text-align:left;" aria-pressed="false">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <span class="label">Toggle theme</span>
        </button>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="sidebar-link" style="width:100%; border:none; background:transparent; cursor:pointer; text-align:left;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                <span class="label">Sign out</span>
            </button>
        </form>
    </div>
</aside>
</th:block>

<th:block th:fragment="scripts">
    <script th:src="@{/js/app.js}"></script>
</th:block>

</body>
</html>
